<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Kalam:wght@700&family=Mukta:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="demo" id="demoBar" hidden><div class="wrap" data-t="demo"></div></div>
<header class="top">
  <div class="wrap">
    <a class="mark" data-nav="home" href="index.html"><span class="mark-dot" aria-hidden="true">ई</span><span class="js-name"></span></a>
    <nav class="nav" aria-label="Main">
      <a data-nav="home" href="index.html"><i data-ico="home"></i><span data-t="navHome"></span></a>
      <a data-nav="services" href="services.html"><i data-ico="services"></i><span data-t="navServices"></span></a>
      <a data-nav="rates" href="rates.html"><i data-ico="rates"></i><span data-t="navRates"></span></a>
      <a data-nav="enquiry" href="enquiry.html"><i data-ico="enquiry"></i><span data-t="navEnquiry"></span></a>
      <a data-nav="contact" href="contact.html"><i data-ico="contact"></i><span data-t="navContact"></span></a>
    </nav>
    <button class="lang" id="langBtn" type="button"></button>
  </div>
</header>
<main id="page" data-page="enquiry">
  <header class="phead poster ph-blue"><div class="wrap"><h1 data-t="enqH"></h1><p data-t="enqP"></p></div></header>
  <section class="sec" aria-label="Enquiry">
    <div class="wrap two">
      <form class="form card" id="enqForm" novalidate>
        <div class="row2">
          <div class="field"><label for="enqName" data-t="fName"></label><input type="text" id="enqName" autocomplete="name"></div>
          <div class="field"><label for="enqMobile" data-t="fMobile"></label><input type="tel" id="enqMobile" inputmode="numeric" maxlength="10" autocomplete="tel-national"></div>
        </div>
        <div class="field"><label for="enqService" data-t="fService"></label><select id="enqService"></select></div>
        <div class="field"><label for="enqMsg" data-t="fMsg"></label><textarea id="enqMsg"></textarea></div>
        <p class="err" id="enqErr" role="alert" hidden></p>
        <a class="btn btn-wa" id="sendBtn" href="#" target="_blank" rel="noopener"><i data-ico="wa"></i><span data-t="send"></span></a>
        <p class="fine" data-t="enqNote"></p>
      </form>
      <aside class="aside">
        <div class="chat"><p class="lbl" data-t="prevLbl"></p><div class="bubble" id="waPreview"></div></div>
        <div class="direct card">
          <h2 data-t="asideH"></h2>
          <span class="status js-status"></span>
          <dl>
            <div><dt class="lbl" data-t="lblPhone"></dt><dd class="js-phone-text"></dd></div>
            <div><dt class="lbl" data-t="lblToday"></dt><dd class="js-today"></dd></div>
          </dl>
          <a class="btn btn-plain js-wa" href="#" target="_blank" rel="noopener"><i data-ico="wa"></i><span data-t="ctaWa"></span></a>
        </div>
      </aside>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">
    <p class="foot-name js-name"></p>
    <p class="js-address"></p>
    <p class="small" id="footOwn"></p>
    <p class="small"><span data-t="footGov"></span> <a href="https://emitra.rajasthan.gov.in" target="_blank" rel="noopener">emitra.rajasthan.gov.in</a></p>
  </div>
</footer>
<a class="btn btn-wa fab js-wa" href="#" target="_blank" rel="noopener"><i data-ico="wa"></i><span class="fab-t">WhatsApp</span></a>
<script src="site.js"></script>
</body>
</html>
