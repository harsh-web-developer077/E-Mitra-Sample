<body>
<div class="demo" id="demoBar" hidden><div class="wrap" data-t="demo"></div></div>
<header class="top">
  <div class="wrap">
    <a class="mark js-name" data-nav="home" href="index.html"></a>
    <nav aria-label="Main">
      <a data-nav="home" href="index.html" data-t="navHome"></a>
      <a data-nav="services" href="services.html" data-t="navServices"></a>
      <a data-nav="rates" href="rates.html" data-t="navRates"></a>
      <a data-nav="enquiry" href="enquiry.html" data-t="navEnquiry"></a>
      <a data-nav="contact" href="contact.html" data-t="navContact"></a>
    </nav>
    <button class="lang" id="langBtn" type="button"></button>
  </div>
</header>
<main class="wrap" id="page" data-page="home">
  <section class="board" aria-labelledby="boardName">
    <div>
      <p class="kicker js-kicker"></p>
      <h1 id="boardName" class="js-name"></h1>
      <p class="say" data-t="boardSay"></p>
      <p class="sub" data-t="boardSub"></p>
      <div class="cta">
        <a class="btn btn-sun" data-nav="services" href="services.html" data-t="ctaServices"></a>
        <a class="btn btn-ghost js-wa" href="#" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.6-1.2A9 9 0 1 0 12 3Zm0 2a7 7 0 1 1-3.6 13l-.4-.2-2.2.6.6-2.1-.3-.4A7 7 0 0 1 12 5Z"/></svg><span data-t="ctaWa"></span></a>
      </div>
    </div>
    <div class="slip">
      <span class="status js-status"></span>
      <dl>
        <div><dt class="lbl" data-t="lblToday"></dt><dd class="js-today"></dd></div>
        <div><dt class="lbl" data-t="lblAddress"></dt><dd class="js-address"></dd></div>
        <div><dt class="lbl" data-t="lblPhone"></dt><dd class="js-phone-text"></dd></div>
      </dl>
    </div>
  </section>

  <section aria-labelledby="catsH">
    <div class="sec-head"><h2 id="catsH" data-t="catsH"></h2><p class="lede" data-t="catsP"></p></div>
    <div class="cats" id="catTiles"></div>
  </section>

  <section aria-labelledby="stepsH">
    <div class="sec-head"><h2 id="stepsH" data-t="stepsH"></h2></div>
    <ol class="steps">
      <li><h3 data-t="s1h"></h3><p data-t="s1p"></p></li>
      <li><h3 data-t="s2h"></h3><p data-t="s2p"></p></li>
      <li><h3 data-t="s3h"></h3><p data-t="s3p"></p></li>
    </ol>
  </section>

  <section class="band" aria-labelledby="bandH">
    <div><h2 id="bandH" data-t="bandH"></h2><p data-t="bandP"></p></div>
    <div class="cta">
      <a class="btn btn-brand" data-nav="enquiry" href="enquiry.html" data-t="bandForm"></a>
      <a class="btn btn-line" data-nav="rates" href="rates.html" data-t="bandRates"></a>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">
    <p class="js-address"></p>
    <p id="footOwn"></p>
    <p><span data-t="footGov"></span> <a href="https://emitra.rajasthan.gov.in" target="_blank" rel="noopener">emitra.rajasthan.gov.in</a></p>
  </div>
</footer>
